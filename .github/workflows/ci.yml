name: CI

# Build and test every pull request and every merge into main, via the shared Soundness-application
# workflow — see propensive/.github for what it does and what it expects of this repository (the
# ./mill wrapper, and the version pins in build.mill).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       pyrocosm.model.compile pyrocosm.terminal.compile pyrocosm.web.compile
      publish_local: pyrocosm.__
      assembly:      pyrocosm.demo.assembly
      test_assembly: pyrocosm.test.assembly
